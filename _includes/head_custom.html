<!-- Consent mode default + dataLayer stub. The gtag.js script itself is NOT
     loaded here — it is injected only after the user grants analytics consent.
     Consent mode alone does NOT stop gtag.js from writing the _ga cookie on
     load, so we gate the script tag itself ("reject = zero GA cookies"). -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    analytics_storage: 'denied',
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied'
  });
  // Lazily inject the GA4 script + config. Called by the consent banner on grant.
  window.poesisLoadGA4 = function () {
    if (window.__poesisGA4Loaded) return;
    window.__poesisGA4Loaded = true;
    gtag('consent', 'update', {
      analytics_storage: 'granted',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-KZGGY5D9GW';
    document.head.appendChild(s);
    gtag('js', new Date());
    // Pin the cookie to the parent domain so a single _ga cookie is shared
    // across poesis.cloud and docs.poesis.cloud (avoids duplicate same-name
    // host-only vs parent-domain cookies when both sites load the same ID).
    gtag('config', 'G-KZGGY5D9GW', { anonymize_ip: true, cookie_domain: 'poesis.cloud' });
  };
</script>

<!-- Google Translate (hidden widget — triggered by header button). Loaded ONLY
     after analytics/functional consent, since it sets the googtrans cookie. -->
<div id="google_translate_element" style="display:none;"></div>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      autoDisplay: false
    }, 'google_translate_element');
  }

  window.poesisLoadGoogleTranslate = function () {
    if (window.__poesisGTranslateLoaded) return;
    window.__poesisGTranslateLoaded = true;
    var s = document.createElement('script');
    s.type = 'text/javascript';
    s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    document.head.appendChild(s);
  };
</script>
<style>
  /* Suppress Google Translate toolbar completely */
  .goog-te-banner-frame { display: none !important; height: 0 !important; visibility: hidden !important; }
  #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
  .skiptranslate { display: none !important; height: 0 !important; }
  body { top: 0 !important; position: static !important; }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    new MutationObserver(function() {
      if (document.body.style.top && document.body.style.top !== "0px") {
        document.body.style.top = "0px";
      }
    }).observe(document.body, { attributes: true, attributeFilter: ["style"] });
  });
</script>

<!-- Consent banner (GA4 + Google Translate gating) -->
<!-- JTD compiles to hardcoded colors (no CSS custom properties at runtime), so
     we use the real compiled hexes per scheme. The JS below toggles
     .consent-banner--dark by watching the jtd stylesheet href. -->
<style>
  .consent-banner {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1200;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    width: min(56rem, calc(100vw - 2rem));
    padding: .9rem 1.1rem;
    /* teal (light) scheme: sidebar bg #f5f6fa, border #eeebee, text #5c5962, link #0fa3a3 */
    background: #ffffff;
    border: 1px solid #eeebee;
    border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
    font-size: .85rem;
  }
  .consent-banner[hidden] { display: none; }
  .consent-banner-text { flex: 1 1 26rem; margin: 0; color: #5c5962; }
  .consent-banner-text a { color: #0fa3a3; }
  .consent-banner-actions { display: flex; gap: .55rem; flex: none; }
  .consent-banner .btn-consent {
    padding: .4rem .85rem;
    border-radius: 6px;
    border: 1px solid #eeebee;
    background: transparent;
    color: #5c5962;
    font: inherit;
    cursor: pointer;
  }
  .consent-banner .btn-consent--primary {
    background: #0fa3a3;
    border-color: #0fa3a3;
    color: #ffffff;
    font-weight: 600;
  }
  /* teal-dark scheme: sidebar bg #27262b, border #44434d, text #e6e1e8, link #14c8c8 */
  .consent-banner.consent-banner--dark {
    background: #27262b;
    border-color: #44434d;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .5);
  }
  .consent-banner--dark .consent-banner-text { color: #e6e1e8; }
  .consent-banner--dark .consent-banner-text a { color: #14c8c8; }
  .consent-banner--dark .btn-consent { border-color: #44434d; color: #e6e1e8; }
  .consent-banner--dark .btn-consent--primary { background: #14c8c8; border-color: #14c8c8; color: #1e0010; }
</style>
<div
  id="consent-banner"
  class="consent-banner"
  role="dialog"
  aria-modal="false"
  aria-label="Cookie consent"
  aria-describedby="consent-banner-text"
  hidden
>
  <p id="consent-banner-text" class="consent-banner-text">
    We use Google Analytics to understand how the docs are used. Analytics cookies
    are only set with your consent. See the
    <a href="https://poesis.cloud/legal/cookies">cookie policy</a> and
    <a href="https://poesis.cloud/legal/privacy">privacy policy</a>.
  </p>
  <div class="consent-banner-actions">
    <button type="button" class="btn-consent" data-consent="denied">Reject</button>
    <button type="button" class="btn-consent btn-consent--primary" data-consent="granted">Accept</button>
  </div>
</div>
<script>
  (function () {
    var KEY = 'poesis-consent-v1';

    function readConsent() {
      try { return localStorage.getItem(KEY); } catch (e) { return null; }
    }

    function applyConsent(value, clearStale) {
      try { localStorage.setItem(KEY, value); } catch (e) { /* ignore */ }
      if (value === 'granted') {
        // On an explicit accept click, clear stale duplicate GA cookies
        // (host-only vs parent-domain) so GA writes a single parent-scoped
        // cookie. On stored-consent page load we skip this — the cookie is
        // already correct and clearing it would force a new client ID each visit.
        if (clearStale) deleteGACookies();
        // Load GA4 + Google Translate now (neither is on the page until consent).
        if (typeof window.poesisLoadGA4 === 'function') window.poesisLoadGA4();
        if (typeof window.poesisLoadGoogleTranslate === 'function') window.poesisLoadGoogleTranslate();
      } else {
        // Reject: ensure no GA cookie persists (defensive — GA4 isn't loaded, but
        // clear any _ga cookie a previous version/third party may have set).
        deleteGACookies();
      }
    }

    function deleteGACookies() {
      var hosts = [location.hostname, '.' + location.hostname];
      var parts = location.hostname.split('.');
      if (parts.length > 2) hosts.push('.' + parts.slice(-2).join('.'));
      document.cookie.split(';').forEach(function (c) {
        var name = c.split('=')[0].trim();
        if (name === '_ga' || name.indexOf('_ga_') === 0) {
          hosts.forEach(function (h) {
            document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=' + h;
          });
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        }
      });
    }

    var banner = document.getElementById('consent-banner');
    if (!banner) return;

    // Reflect the active JTD color scheme (light vs dark) on the banner. The theme
    // toggle swaps the stylesheet href, so watch it and read the scheme name.
    function syncScheme() {
      var link = document.querySelector('link[href*="just-the-docs-"]');
      var dark = false;
      if (link) {
        var m = /just-the-docs-([a-z-]+)\.css/.exec(link.getAttribute('href') || '');
        dark = !!(m && /dark/.test(m[1]));
      } else {
        var saved = null;
        try { saved = localStorage.getItem('jtd-theme'); } catch (e) { /* ignore */ }
        dark = /dark/.test(saved || '');
      }
      banner.classList.toggle('consent-banner--dark', dark);
    }
    document.addEventListener('DOMContentLoaded', function () {
      syncScheme();
      var link = document.querySelector('link[href*="just-the-docs-"]');
      if (link) {
        new MutationObserver(syncScheme).observe(link, { attributes: true, attributeFilter: ['href'] });
      }
    });

    function show() { banner.hidden = false; }
    function hide() { banner.hidden = true; }

    banner.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('[data-consent]') : null;
      if (!btn) return;
      applyConsent(btn.getAttribute('data-consent'), /* clearStale */ true);
      hide();
    });

    document.addEventListener('click', function (e) {
      var t = e.target && e.target.closest ? e.target.closest('[data-cookie-settings]') : null;
      if (!t) return;
      e.preventDefault();
      show();
    });

    var stored = readConsent();
    if (stored === 'granted') {
      applyConsent('granted');
    } else if (stored === 'denied') {
      deleteGACookies();
    } else {
      show();
    }
  })();
</script>

<!-- Dark / Light mode toggle -->
<style>
  .theme-toggle {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    z-index: 1000;
    background: var(--body-background-color);
    border: 1px solid var(--border-color);
    border-radius: 50%;
    width: 2.5rem;
    height: 2.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: background 0.2s;
    padding: 0;
    line-height: 0;
  }
  .theme-toggle svg {
    width: 1.15rem;
    height: 1.15rem;
    fill: currentColor;
    color: var(--body-text-color);
  }
  .theme-toggle:hover {
    opacity: 0.8;
  }
</style>

<script>
  (function() {
    var saved = localStorage.getItem("jtd-theme") || "teal";

    var moonSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>';
    var sunSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 18a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1zm9-9a1 1 0 0 1 0 2h-1a1 1 0 1 1 0-2h1zM4 11a1 1 0 0 1 0 2H3a1 1 0 1 1 0-2h1zm15.07-6.07a1 1 0 0 1 0 1.41l-.71.71a1 1 0 1 1-1.41-1.41l.71-.71a1 1 0 0 1 1.41 0zM7.05 17.66a1 1 0 0 1 0 1.41l-.71.71a1 1 0 1 1-1.41-1.41l.71-.71a1 1 0 0 1 1.41 0zm12.02 0a1 1 0 0 1-1.41 1.41l-.71-.71a1 1 0 1 1 1.41-1.41l.71.71zM7.05 6.34a1 1 0 0 1-1.41 0l-.71-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41z"/></svg>';

    document.addEventListener("DOMContentLoaded", function() {
      var scheme = localStorage.getItem("jtd-theme") || "teal";
      var isDark = scheme === "teal-dark";

      // Apply saved scheme via jtd API
      if (typeof jtd !== "undefined" && jtd.setTheme) {
        jtd.setTheme(scheme);
      }

      // Create toggle button
      var btn = document.createElement("button");
      btn.className = "theme-toggle";
      btn.setAttribute("aria-label", "Toggle dark mode");
      btn.innerHTML = isDark ? sunSVG : moonSVG;
      document.body.appendChild(btn);

      btn.addEventListener("click", function() {
        var current = localStorage.getItem("jtd-theme") || "teal";
        var next = current === "teal-dark" ? "teal" : "teal-dark";
        localStorage.setItem("jtd-theme", next);
        btn.innerHTML = next === "teal-dark" ? sunSVG : moonSVG;

        if (typeof jtd !== "undefined" && jtd.setTheme) {
          jtd.setTheme(next);
        }
      });
    });
  })();
</script>
