title: Documentation
description: User documentation for Poesis solutions and products — ITIP, SIE, GSM, SAF
url: "https://docs.poesis.cloud"
baseurl: ""

remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: teal

permalink: pretty

nav_sort: case_insensitive

aux_links:
  "Poesis on GitHub":
    - "https://github.com/poesis-cloud"

footer_content: "&copy; 2026 Poesis. All rights reserved."

search_enabled: true

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

# Mermaid diagram rendering for fenced mermaid code blocks (Just the Docs)
mermaid:
  version: "10.9.1"

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-redirect-from

include:
  - CNAME

exclude:
  - .vscode/
  - .github/
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - _comsite/
  # GSM specifications hidden until publication (strategy: publication target ~Oct 2026)
  - gsm/specifications/
