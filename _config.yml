title: Poesis Documentation
description: User documentation for Poesis solutions and products — ITIP, SIE, GSM, SAF
url: "https://docs.poesis.cloud"
baseurl: ""

remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: teal

permalink: pretty

nav_sort: case_insensitive

# GA4 — same web stream as poesis.cloud (subdomains share the .poesis.cloud cookie,
# so corporate → docs journeys are one session; split reporting by hostname).
ga_tracking: G-KZGGY5D9GW

aux_links:
  "poesis.cloud":
    - "https://poesis.cloud"
  "Poesis on GitHub":
    - "https://github.com/poesis-cloud"

footer_content: '&copy; 2026 <a href="https://poesis.cloud">Poesis</a>. All rights reserved.'

search_enabled: true

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

# Mermaid diagram rendering for fenced mermaid code blocks (Just the Docs)
mermaid:
  version: "10.9.1"

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-redirect-from
  - jekyll-sitemap

# Default social-sharing image for every page (consumed by jekyll-seo-tag).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

include:
  - CNAME

exclude:
  - .vscode/
  - .github/
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  # GSM specifications hidden until publication (strategy: publication target ~Oct 2026)
  - gsm/specifications/
